name: X-SELF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
      HELPER_BOT_USERNAME: ${{ secrets.HELPER_BOT_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          required = [
              "BOT_TOKEN",
              "TELEGRAM_API_ID",
              "TELEGRAM_API_HASH",
              "OWNER_ID",
              "HELPER_BOT_TOKEN",
              "HELPER_BOT_USERNAME",
          ]

          missing = [x for x in required if not os.getenv(x)]

          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )

          print("All required secrets are available.")
          PY

      - name: Check repository files
        run: |
          test -f main_bot.py
          test -f helper_bot.py
          test -f control_store.py
          test -f requirements.txt
          echo "Repository files OK."

      - name: Initialize application database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from control_store import (
              init_users_db,
              set_app_settings,
          )

          data_dir = Path("data")
          data_dir.mkdir(parents=True, exist_ok=True)

          db_path = data_dir / "users.db"

          # Create the database/tables using the project's own code.
          init_users_db(db_path)

          # Configure the Helper through the project's existing
          # settings mechanism. No project source file is modified.
          set_app_settings(
              db_path,
              {
                  "helper_token": os.environ["HELPER_BOT_TOKEN"],
                  "helper_username": os.environ["HELPER_BOT_USERNAME"],
                  "helper_enabled": "1",
              },
          )

          print("Helper configuration initialized.")
          print(f"Database: {db_path}")
          PY

      - name: Verify Helper configuration
        run: |
          python - <<'PY'
          from control_store import get_helper_config

          config = get_helper_config("data/users.db")

          print("Helper enabled:", config.get("enabled"))
          print("Helper username:", config.get("username"))
          print(
              "Helper token configured:",
              bool(config.get("token"))
          )

          if not config.get("enabled"):
              raise SystemExit("Helper is not enabled.")

          if not config.get("token"):
              raise SystemExit("Helper token is missing.")

          if not config.get("username"):
              raise SystemExit("Helper username is missing.")

          print("Helper database configuration OK.")
          PY

      - name: Compile Python files
        continue-on-error: true
        run: |
          python -m compileall -q .

      - name: Run tests
        continue-on-error: true
        run: |
          python -m pytest -vv -rA --tb=long

      - name: Start Helper Bot
        run: |
          rm -f data/helper.status.json

          nohup python helper_bot.py \
            --data-dir "$(pwd)/data" \
            --status-file "$(pwd)/data/helper.status.json" \
            > helper.log 2>&1 &

          echo $! > helper.pid

          echo "Helper PID:"
          cat helper.pid

      - name: Wait for Helper
        run: |
          echo "Waiting for Helper to become ready..."

          for i in $(seq 1 30); do
            echo "Check $i/30"

            if [ -f data/helper.status.json ]; then
              cat data/helper.status.json
              echo

              python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/helper.status.json")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(1)

          print("Status:", data.get("status"))

          if data.get("status") == "ready":
              raise SystemExit(0)

          raise SystemExit(1)
          PY

              if [ $? -eq 0 ]; then
                echo "Helper is READY."
                exit 0
              fi
            fi

            sleep 2
          done

          echo "Helper did not become ready."
          echo "========== helper.log =========="
          cat helper.log || true
          echo "================================"

          exit 1

      - name: Start Main Bot
        run: |
          echo "Starting main_bot.py..."
          python main_bot.py

      - name: Show Helper log
        if: always()
        run: |
          echo "========== helper.log =========="
          cat helper.log || true
          echo "================================"
