name: X-SELF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      OWNER_ID: ${{ secrets.OWNER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall -q .

      - name: Run tests
        run: |
          python -m pytest -q


  run-bots:
    name: Run X-SELF
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      OWNER_ID: ${{ secrets.OWNER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check configuration
        run: |
          python - <<'PY'
          import os

          required = [
              "BOT_TOKEN",
              "TELEGRAM_API_ID",
              "TELEGRAM_API_HASH",
              "OWNER_ID",
          ]

          missing = [x for x in required if not os.getenv(x)]

          if missing:
              print("Missing GitHub Secrets:")
              for item in missing:
                  print(f"- {item}")
              raise SystemExit(1)

          print("All required environment variables are configured.")
          PY

      - name: Start helper bot
        run: |
          if [ -f helper_bot.py ]; then
            echo "Starting helper_bot.py..."
            nohup python helper_bot.py > helper.log 2>&1 &
            echo $! > helper.pid
          else
            echo "helper_bot.py not found."
          fi

      - name: Wait for helper
        run: |
          sleep 5

          if [ -f helper.log ]; then
            echo "===== HELPER LOG ====="
            cat helper.log
            echo "======================"
          fi

      - name: Start main bot
        run: |
          python main_bot.py
