name: X-SELF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
      HELPER_BOT_USERNAME: ${{ secrets.HELPER_BOT_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check Secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "BOT_TOKEN",
              "TELEGRAM_API_ID",
              "TELEGRAM_API_HASH",
              "OWNER_ID",
              "HELPER_BOT_TOKEN",
              "HELPER_BOT_USERNAME",
          ]

          missing = [name for name in required if not os.getenv(name)]

          if missing:
              raise SystemExit(
                  "Missing GitHub Secrets: " + ", ".join(missing)
              )

          print("All required secrets are configured.")
          PY

      - name: Check project files
        run: |
          test -f main_bot.py
          test -f helper_bot.py
          test -f control_store.py
          test -f requirements.txt

          echo "Project files OK."

      - name: Prepare Helper database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from control_store import (
              ensure_app_settings,
              set_app_settings,
          )

          data_dir = Path("data")
          data_dir.mkdir(parents=True, exist_ok=True)

          db_path = data_dir / "users.db"

          # Use the project's own database/settings functions.
          ensure_app_settings(db_path)

          set_app_settings(
              db_path,
              {
                  "helper_enabled": "1",
                  "helper_token": os.environ["HELPER_BOT_TOKEN"],
                  "helper_username": os.environ["HELPER_BOT_USERNAME"],
              },
          )

          print("Helper configuration written to data/users.db")
          PY

      - name: Verify Helper database
        run: |
          python - <<'PY'
          from control_store import get_helper_config

          config = get_helper_config("data/users.db")

          print("Helper enabled:", config["enabled"])
          print("Helper username:", config["username"])
          print("Helper token configured:", bool(config["token"]))

          if not config["enabled"]:
              raise SystemExit("Helper is disabled.")

          if not config["token"]:
              raise SystemExit("Helper token is missing.")

          if not config["username"]:
              raise SystemExit("Helper username is missing.")

          print("Helper database configuration is OK.")
          PY

      - name: Compile project
        continue-on-error: true
        run: |
          python -m compileall -q .

      - name: Run tests
        continue-on-error: true
        run: |
          python -m pytest -vv -rA --tb=long

      - name: Start Helper
        run: |
          rm -f data/helper.status.json
          rm -f helper.log
          rm -f helper.pid

          nohup python helper_bot.py \
            --data-dir "$(pwd)/data" \
            --status-file "$(pwd)/data/helper.status.json" \
            > helper.log 2>&1 &

          echo $! > helper.pid

          echo "Helper PID:"
          cat helper.pid

      - name: Wait for Helper Ready
        run: |
          echo "Waiting for Helper..."

          for i in $(seq 1 30); do
            echo "Attempt $i/30"

            if [ -f data/helper.status.json ]; then
              echo "Status file:"
              cat data/helper.status.json
              echo

              python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/helper.status.json")

          try:
              status = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception:
              raise SystemExit(1)

          print("Current status:", status.get("status"))

          if status.get("status") == "ready":
              print("Helper is READY.")
              raise SystemExit(0)

          raise SystemExit(1)
          PY

              if [ $? -eq 0 ]; then
                exit 0
              fi
            fi

            sleep 2
          done

          echo ""
          echo "========================================"
          echo "HELPER DID NOT BECOME READY"
          echo "========================================"
          echo ""

          echo "----- helper.log -----"
          cat helper.log || true

          echo ""
          echo "----- helper status -----"
          cat data/helper.status.json || true

          exit 1

      - name: Start Main Bot
        run: |
          echo "Helper is ready."
          echo "Starting main_bot.py..."

          python main_bot.py

      - name: Print Helper Log
        if: always()
        run: |
          echo "========================================"
          echo "HELPER LOG"
          echo "========================================"

          cat helper.log || true

          echo "========================================"
