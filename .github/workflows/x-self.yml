name: X-SELF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================================
  # 1) BUILD & TEST
  # ==========================================================

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      OWNER_ID: ${{ secrets.OWNER_ID }}

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # ------------------------------------------------------
      # بررسی ساختار پروژه
      # ------------------------------------------------------

      - name: Check repository
        run: |
          echo "========================================"
          echo "X-SELF REPOSITORY"
          echo "========================================"

          echo "Working directory:"
          pwd

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Python files:"
          find . -maxdepth 2 -type f -name "*.py" | sort

      # ------------------------------------------------------
      # Syntax check
      # ------------------------------------------------------

      - name: Check Python syntax
        continue-on-error: true
        run: |
          python -m compileall -q .

      # ------------------------------------------------------
      # Tests
      #
      # Fail شدن تست‌ها Workflow را متوقف نمی‌کند.
      # ------------------------------------------------------

      - name: Run tests
        continue-on-error: true
        run: |
          echo "========================================"
          echo "RUNNING TESTS"
          echo "========================================"

          python -m pytest -vv -rA --tb=long

      # ------------------------------------------------------
      # پایان تست
      # ------------------------------------------------------

      - name: Test summary
        if: always()
        run: |
          echo "========================================"
          echo "TEST PHASE FINISHED"
          echo "========================================"

          echo "Test failures do not stop the workflow."

          echo ""
          echo "No source files were modified."


  # ==========================================================
  # 2) RUN
  # ==========================================================

  run-bots:
    name: Run X-SELF
    runs-on: ubuntu-latest

    # عمداً به build-and-test وابسته نیست
    # تا Fail تست‌ها مانع اجرای این Job نشود.

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      OWNER_ID: ${{ secrets.OWNER_ID }}

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ------------------------------------------------------
      # بررسی Secrets
      # ------------------------------------------------------

      - name: Check configuration
        run: |
          python - <<'PY'
          import os
          import sys

          required = [
              "BOT_TOKEN",
              "TELEGRAM_API_ID",
              "TELEGRAM_API_HASH",
              "OWNER_ID",
          ]

          missing = [
              item
              for item in required
              if not os.getenv(item)
          ]

          if missing:
              print("========================================")
              print("MISSING GITHUB SECRETS")
              print("========================================")

              for item in missing:
                  print(f"- {item}")

              sys.exit(1)

          print("========================================")
          print("CONFIGURATION OK")
          print("========================================")
          PY

      # ------------------------------------------------------
      # بررسی فایل‌های اصلی
      # ------------------------------------------------------

      - name: Verify project files
        run: |
          echo "========================================"
          echo "PROJECT FILE CHECK"
          echo "========================================"

          for file in \
            main_bot.py \
            helper_bot.py \
            self_bot.py \
            self_features.py \
            admin_ui.py \
            admin_center.py \
            advanced_features.py \
            control_store.py \
            db_utils.py \
            send_queue.py
          do

            if [ -f "$file" ]; then
              echo "OK      $file"
            else
              echo "MISSING $file"
            fi

          done

      # ------------------------------------------------------
      # بررسی اینکه پروژه بدون اجرای واقعی Import می‌شود
      # ------------------------------------------------------

      - name: Check main module
        continue-on-error: true
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              "main_bot.py",
              "helper_bot.py",
          ]

          for name in files:
              path = Path(name)

              if not path.exists():
                  print(f"SKIP: {name}")
                  continue

              print(f"Checking: {name}")

              with path.open(
                  "r",
                  encoding="utf-8"
              ) as f:
                  ast.parse(
                      f.read(),
                      filename=name
                  )

              print(f"OK: {name}")

          PY

      # ------------------------------------------------------
      # اجرای Helper
      #
      # فقط اگر شرایط خود پروژه اجازه بدهد.
      # ------------------------------------------------------

      - name: Start helper bot
        run: |
          if [ ! -f helper_bot.py ]; then
            echo "helper_bot.py not found."
            exit 0
          fi

          echo "========================================"
          echo "STARTING HELPER"
          echo "========================================"

          nohup python helper_bot.py \
            > helper.log 2>&1 &

          HELPER_PID=$!

          echo "$HELPER_PID" > helper.pid

          echo "Helper PID: $HELPER_PID"

      # ------------------------------------------------------
      # بررسی Helper
      # ------------------------------------------------------

      - name: Check helper
        run: |
          sleep 5

          echo "========================================"
          echo "HELPER LOG"
          echo "========================================"

          if [ -f helper.log ]; then
            cat helper.log
          else
            echo "helper.log does not exist."
          fi

          echo ""
          echo "========================================"
          echo "HELPER PROCESS"
          echo "========================================"

          if [ -f helper.pid ]; then

            PID=$(cat helper.pid)

            if kill -0 "$PID" 2>/dev/null; then
              echo "Helper process is running."
            else
              echo "Helper process stopped."
            fi

          else
            echo "No helper PID."
          fi

      # ------------------------------------------------------
      # Main Bot
      # ------------------------------------------------------

      - name: Start main bot
        run: |
          echo "========================================"
          echo "STARTING MAIN BOT"
          echo "========================================"

          python main_bot.py
